name: Build MSI (x86)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Restore Packages
        run: msbuild XenAdmin.sln -t:restore -property:Platform=x86 -property:PlatformTarget=x86
      - name: Build Release solution (x86)
        run: msbuild XenAdmin.sln -property:Configuration=Release -property:Platform=x86 -property:PlatformTarget=x86
      - name: Build Debug solution (x86)
        run: msbuild XenAdmin.sln -property:Configuration=Debug -property:Platform=x86 -property:PlatformTarget=x86
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build WiX on Windows
        run: msbuild -restore Install\Install.wixproj
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drop-release-x86
          path: XenAdmin/bin/Release/net481
      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drop-debug-x86
          path: XenAdmin/bin/Debug/net481