name: Build MSI (x86)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Restore Packages
        run: msbuild XenAdmin.sln -t:restore -property:Platform=x86 -property:PlatformTarget=x86
      - name: Build Release solution (x86)
        run: msbuild XenAdmin.sln -property:Configuration=Release -property:Platform=x86 -property:PlatformTarget=x86
      - name: Build Debug solution (x86)
        run: msbuild XenAdmin.sln -property:Configuration=Debug -property:Platform=x86 -property:PlatformTarget=x86
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build WiX on Windows
        run: msbuild Install\Install.wixproj -property:Configuration=Release -property:Platform=x86
      - name: Stage MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $msi = Get-ChildItem -Path Install -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No se encontró ningún MSI bajo Install" }
          Copy-Item $msi.FullName -Destination dist/
          
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
          generate_release_notes: true
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drop-release-x86
          path: XenAdmin/bin/Release/net481
      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: drop-debug-x86
          path: XenAdmin/bin/Debug/net481